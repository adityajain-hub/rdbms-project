<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2c3e50"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#8e44ad"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" fill="#fafafa" rx="6"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Campus Lost &amp; Found — Entity Relationship Diagram</text>
  <line x1="40" y1="40" x2="780" y2="40" stroke="#ccc" stroke-width="1"/>

  <!-- ══ USERS entity ══ -->
  <rect x="30" y="190" width="180" height="185" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
  <rect x="30" y="190" width="180" height="30" rx="5" fill="#2980b9"/>
  <rect x="30" y="205" width="180" height="15" fill="#2980b9"/>
  <text x="120" y="210" text-anchor="middle" fill="white" font-weight="bold" font-size="13">users</text>
  <line x1="30" y1="220" x2="210" y2="220" stroke="#2980b9" stroke-width="1"/>
  <text x="40" y="240" font-size="10.5"><tspan font-weight="bold" text-decoration="underline">PK</tspan> user_id   INT AI</text>
  <text x="40" y="258" font-size="10.5">full_name  VARCHAR(100)</text>
  <text x="40" y="276" font-size="10.5">email      VARCHAR(100) UNIQUE</text>
  <text x="40" y="294" font-size="10.5">phone      VARCHAR(20)</text>
  <text x="40" y="312" font-size="10.5">role       ENUM</text>
  <text x="40" y="330" font-size="9.5" fill="#888">(STUDENT/FACULTY/STAFF/ADMIN)</text>
  <text x="40" y="368" font-size="9.5" fill="#2980b9" font-style="italic">→ reports items</text>

  <!-- ══ CATEGORIES entity ══ -->
  <rect x="30" y="55" width="180" height="100" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
  <rect x="30" y="55" width="180" height="30" rx="5" fill="#2980b9"/>
  <rect x="30" y="70" width="180" height="15" fill="#2980b9"/>
  <text x="120" y="75" text-anchor="middle" fill="white" font-weight="bold" font-size="13">categories</text>
  <line x1="30" y1="85" x2="210" y2="85" stroke="#2980b9" stroke-width="1"/>
  <text x="40" y="105" font-size="10.5"><tspan font-weight="bold" text-decoration="underline">PK</tspan> category_id    INT AI</text>
  <text x="40" y="123" font-size="10.5">category_name  VARCHAR(50)</text>
  <text x="40" y="141" font-size="9.5" fill="#888">UNIQUE</text>

  <!-- ══ ITEMS entity (center) ══ -->
  <rect x="310" y="110" width="195" height="255" rx="5" fill="#fef9e7" stroke="#e67e22" stroke-width="2"/>
  <rect x="310" y="110" width="195" height="30" rx="5" fill="#e67e22"/>
  <rect x="310" y="125" width="195" height="15" fill="#e67e22"/>
  <text x="407" y="130" text-anchor="middle" fill="white" font-weight="bold" font-size="13">items</text>
  <line x1="310" y1="140" x2="505" y2="140" stroke="#e67e22" stroke-width="1"/>
  <text x="320" y="160" font-size="10.5"><tspan font-weight="bold" text-decoration="underline">PK</tspan> item_id     INT AI</text>
  <text x="320" y="178" font-size="10.5">report_type  ENUM(LOST, FOUND)</text>
  <text x="320" y="196" font-size="10.5">title        VARCHAR(100)</text>
  <text x="320" y="214" font-size="10.5">description  TEXT</text>
  <text x="320" y="232" font-size="10.5" fill="#c0392b"><tspan font-weight="bold">FK</tspan> category_id INT</text>
  <text x="320" y="250" font-size="10.5">location     VARCHAR(100)</text>
  <text x="320" y="268" font-size="10.5">date_incident DATE</text>
  <text x="320" y="286" font-size="10.5">status       ENUM</text>
  <text x="320" y="304" font-size="9.5" fill="#888">(ACTIVE/CLAIM_PENDING/RESOLVED)</text>
  <text x="320" y="322" font-size="10.5" fill="#c0392b"><tspan font-weight="bold">FK</tspan> reported_by INT</text>
  <text x="320" y="356" font-size="9.5" fill="#e67e22" font-style="italic">Central entity of the system</text>

  <!-- ══ CLAIMS entity ══ -->
  <rect x="600" y="110" width="190" height="200" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <rect x="600" y="110" width="190" height="30" rx="5" fill="#27ae60"/>
  <rect x="600" y="125" width="190" height="15" fill="#27ae60"/>
  <text x="695" y="130" text-anchor="middle" fill="white" font-weight="bold" font-size="13">claims</text>
  <line x1="600" y1="140" x2="790" y2="140" stroke="#27ae60" stroke-width="1"/>
  <text x="610" y="160" font-size="10.5"><tspan font-weight="bold" text-decoration="underline">PK</tspan> claim_id         INT AI</text>
  <text x="610" y="178" font-size="10.5" fill="#c0392b"><tspan font-weight="bold">FK</tspan> item_id          INT</text>
  <text x="610" y="196" font-size="10.5">claimant_name    VARCHAR(100)</text>
  <text x="610" y="214" font-size="10.5">claimant_contact VARCHAR(50)</text>
  <text x="610" y="232" font-size="10.5">proof_details    TEXT</text>
  <text x="610" y="250" font-size="10.5">status           ENUM</text>
  <text x="610" y="268" font-size="9.5" fill="#888">(PENDING/APPROVED/REJECTED)</text>
  <text x="610" y="300" font-size="9.5" fill="#27ae60" font-style="italic">→ ON DELETE CASCADE from items</text>

  <!-- ══ ACTIVITY_LOGS entity ══ -->
  <rect x="600" y="350" width="190" height="155" rx="5" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <rect x="600" y="350" width="190" height="30" rx="5" fill="#8e44ad"/>
  <rect x="600" y="365" width="190" height="15" fill="#8e44ad"/>
  <text x="695" y="370" text-anchor="middle" fill="white" font-weight="bold" font-size="13">activity_logs</text>
  <line x1="600" y1="380" x2="790" y2="380" stroke="#8e44ad" stroke-width="1"/>
  <text x="610" y="400" font-size="10.5"><tspan font-weight="bold" text-decoration="underline">PK</tspan> log_id      INT AI</text>
  <text x="610" y="418" font-size="10.5">action_type VARCHAR(50)</text>
  <text x="610" y="436" font-size="10.5">details     VARCHAR(255)</text>
  <text x="610" y="454" font-size="10.5">log_time    TIMESTAMP</text>
  <text x="610" y="490" font-size="9.5" fill="#8e44ad" font-style="italic">Auto-populated by Trigger</text>

  <!-- ══ Relationship lines ══ -->
  <!-- users → items (reported_by) -->
  <line x1="210" y1="250" x2="310" y2="250" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="218" y="243" font-size="9" fill="#555">1</text>
  <text x="295" y="243" font-size="9" fill="#555">M</text>
  <text x="222" y="264" font-size="9" fill="#555" font-style="italic">reports</text>

  <!-- categories → items (category_id) -->
  <line x1="120" y1="155" x2="120" y2="172" stroke="#2c3e50" stroke-width="1.8"/>
  <line x1="120" y1="172" x2="310" y2="200" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="140" y="190" font-size="9" fill="#555" font-style="italic">classifies</text>
  <text x="215" y="193" font-size="9" fill="#555">M</text>
  <text x="110" y="162" font-size="9" fill="#555">1</text>

  <!-- items → claims (item_id) -->
  <line x1="505" y1="200" x2="600" y2="200" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="510" y="193" font-size="9" fill="#555">1</text>
  <text x="585" y="193" font-size="9" fill="#555">M</text>
  <text x="518" y="214" font-size="9" fill="#555" font-style="italic">has claims</text>

  <!-- trigger: claims → activity_logs (dashed) -->
  <line x1="695" y1="310" x2="695" y2="350" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-purple)"/>
  <text x="698" y="338" font-size="9" fill="#8e44ad" font-weight="bold">TRIGGER fires</text>

  <!-- ══ Legend ══ -->
  <rect x="30" y="460" width="250" height="82" rx="4" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="42" y="480" font-size="10.5" font-weight="bold" fill="#2c3e50">Legend</text>
  <line x1="42" y1="494" x2="75" y2="494" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="80" y="498" font-size="10">Foreign Key Reference</text>
  <line x1="42" y1="514" x2="75" y2="514" stroke="#8e44ad" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr-purple)"/>
  <text x="80" y="518" font-size="10">Trigger (automatic action)</text>
  <text x="42" y="534" font-size="10"><tspan font-weight="bold" text-decoration="underline">PK</tspan> = Primary Key  ·  <tspan fill="#c0392b" font-weight="bold">FK</tspan> = Foreign Key  ·  1..M = Cardinality</text>
</svg>
